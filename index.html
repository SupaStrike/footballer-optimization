<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footballer Optimization</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <h1>Footballer Optimization</h1>
    <p>Free, position-based training guidance for footballers aged 12-20</p>
  </header>

  <main>

    <section id="view-form" class="view">
      <form id="player-form">

        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="12" max="20" required>
        </div>

        <div class="field">
          <label for="weight">Weight (kg)</label>
          <input type="number" id="weight" name="weight" min="30" max="120" step="0.1" required>
        </div>

        <div class="field">
          <label for="height">Height (cm)</label>
          <input type="number" id="height" name="height" min="130" max="210" required>
        </div>

        <div class="field">
          <label for="fitness">Fitness level</label>
          <select id="fitness" name="fitness" required>
            <option value="">Select your level</option>
            <option value="beginner">Beginner (train 0-1 times a week)</option>
            <option value="intermediate">Intermediate (train 2-3 times a week)</option>
            <option value="advanced">Advanced (train 4+ times a week)</option>
          </select>
        </div>

        <div class="field">
          <label for="position">Position</label>
          <select id="position" name="position" required>
            <option value="">Select your position</option>
            <option value="goalkeeper">Goalkeeper</option>
            <option value="centre-back">Centre-back</option>
            <option value="full-back">Full-back</option>
            <option value="midfielder">Midfielder</option>
            <option value="winger">Winger</option>
            <option value="striker">Striker</option>
          </select>
        </div>

        <button type="submit">Generate my plan</button>

      </form>
    </section>

  </main>

  <footer>
    <p>General guidance only. Not medical advice. Speak to a coach or doctor if unsure.</p>
  </footer>

</body>
</html>
